<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverDistro | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc; 
            -webkit-font-smoothing: antialiased; 
        }
        
        /* Permanent Sidebar Layout */
        .sidebar {
            width: 240px;
            background-color: #020617;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            display: flex;
            flex-direction: column;
            z-index: 50;
            transition: width 0.3s;
        }

        .main-workspace {
            margin-left: 240px;
            min-height: 100vh;
            background-color: #030712;
            transition: margin-left 0.3s;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
            background: #0f172a;
        }

        .nav-link.active { color: #3b82f6; }

        /* Professional Table */
        .studio-table { width: 100%; border-collapse: collapse; }
        .studio-table th { 
            text-align: left; 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #64748b; 
            padding: 14px 20px; 
            border-bottom: 1px solid #1e293b;
            letter-spacing: 0.05em;
        }
        .studio-table td { padding: 16px 20px; border-bottom: 1px solid #0f172a; font-size: 13px; }
        .studio-table tr:hover { background: rgba(255,255,255,0.01); }

        /* Status Pills */
        .status { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .status-approved { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

        /* Mobile Adjustments (Sidebar stays as icons) */
        @media (max-width: 768px) {
            .sidebar { width: 64px; padding: 12px 0; }
            .sidebar span, .sidebar p, .sidebar #userName { display: none; }
            .sidebar .nav-link { justify-content: center; padding: 16px 0; }
            .main-workspace { margin-left: 64px; }
            .hide-mobile { display: none; }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- Permanent Sidebar -->
    <aside class="sidebar">
        <div class="p-6 flex items-center gap-3">
            <img src="https://vinxbbpboupirnyxwghz.supabase.co/storage/v1/object/public/Ever-Music/file_00000000535c71f4a154bd2a598fddd0.png" class="h-6 w-auto">
            <span class="font-bold text-lg tracking-tight">Studio</span>
        </div>

        <nav class="flex-1 px-3 space-y-1">
            <a href="dashboard.html" class="nav-link active"><i data-lucide="layout-grid" class="w-5 h-5"></i> <span>Overview</span></a>
            <a href="upload.html" class="nav-link"><i data-lucide="upload-cloud" class="w-5 h-5"></i> <span>Upload</span></a>
            <a href="releases.html" class="nav-link"><i data-lucide="disc" class="w-5 h-5"></i> <span>Music</span></a>
            <a href="whitelist.html" class="nav-link"><i data-lucide="shield-check" class="w-5 h-5"></i> <span>Rights</span></a>
            <a href="analytics.html" class="nav-link"><i data-lucide="bar-chart-3" class="w-5 h-5"></i> <span>Stats</span></a>
            <a href="earnings.html" class="nav-link"><i data-lucide="wallet" class="w-5 h-5"></i> <span>Bank</span></a>
            <a href="notifications.html" class="nav-link"><i data-lucide="bell" class="w-5 h-5"></i> <span>Inbox</span></a>
            <a href="settings.html" class="nav-link"><i data-lucide="settings" class="w-5 h-5"></i> <span>Settings</span></a>
        </nav>

        <div class="mt-auto p-4 border-t border-white/5">
            <div class="flex items-center gap-3 mb-4 px-2 truncate">
                <div id="userAvatar" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center flex-shrink-0">
                    <i data-lucide="user" class="w-4 h-4 text-slate-500"></i>
                </div>
                <div class="truncate">
                    <p id="userName" class="text-xs font-bold truncate">Artist</p>
                </div>
            </div>
            <button onclick="logout()" class="w-full flex items-center gap-3 px-2 py-2 text-xs font-bold text-slate-500 hover:text-rose-400">
                <i data-lucide="log-out" class="w-4 h-4"></i> <span>Sign Out</span>
            </button>
        </div>
    </aside>

    <!-- Workspace -->
    <main class="main-workspace">
        
        <!-- Header -->
        <header class="h-14 border-b border-white/5 flex items-center justify-between px-6 lg:px-10 bg-[#020617]">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Dashboard</h2>
            <div class="flex items-center gap-4">
                <a href="upload.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded text-xs font-bold transition-all">New Release</a>
            </div>
        </header>

        <!-- Loader -->
        <div id="loader" class="h-[80vh] flex flex-col items-center justify-center gap-4">
            <div class="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-[10px] font-bold uppercase text-slate-600 tracking-widest">Syncing</p>
        </div>

        <div id="content" class="hidden p-6 lg:p-10 max-w-7xl mx-auto space-y-8">
            
            <!-- Hero -->
            <div>
                <h1 id="welcomeGreeting" class="text-2xl font-bold tracking-tight text-white">Hi, Artist</h1>
                <p class="text-sm text-slate-500 mt-1">Here is a look at your music today.</p>
            </div>

            <!-- Stats Bar -->
            <div id="statsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- Stats injected -->
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Music Table (Asset List) -->
                <div class="lg:col-span-2 space-y-4">
                    <div class="flex items-center justify-between px-1">
                        <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500">Latest Music</h3>
                        <a href="releases.html" class="text-xs font-bold text-blue-500">See All</a>
                    </div>
                    <div class="bg-[#0a0f1e] border border-white/5 rounded-xl overflow-hidden shadow-sm">
                        <table class="studio-table">
                            <thead>
                                <tr>
                                    <th>Release</th>
                                    <th>Status</th>
                                    <th class="hide-mobile">Plays</th>
                                    <th class="text-right">Date</th>
                                </tr>
                            </thead>
                            <tbody id="musicList"></tbody>
                        </table>
                    </div>
                </div>

                <!-- Right Sidebar Tools -->
                <div class="space-y-8">
                    <div class="space-y-4">
                        <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500">Rights</h3>
                        <div id="whitelistBox" class="bg-[#0a0f1e] border border-white/5 p-5 rounded-xl space-y-4">
                            <!-- Whitelist items -->
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h3 class="font-bold text-xs uppercase tracking-widest text-slate-500"></h3>
                        <div class="grid grid-cols-1 gap-2">
                            <a href="earnings.html" class="flex items-center justify-between p-4 bg-[#0a0f1e] border border-white/5 rounded-xl hover:border-blue-500/50 transition-all">
                                <span class="text-sm font-medium">Bank</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
                            </a>
                            <a href="settings.html" class="flex items-center justify-between p-4 bg-[#0a0f1e] border border-white/5 rounded-xl hover:border-blue-500/50 transition-all">
                                <span class="text-sm font-medium">Settings</span>
                                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://nitppjssxvqjrtuyrbos.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdHBwanNzeHZxanJ0dXlyYm9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNzQyNjgsImV4cCI6MjA4NTg1MDI2OH0.O-2UWsBZrw8tyTCXhCcDNAhgY5Ro9_kZRlQoOSUGU3o';
        const { createClient } = window.supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const user = JSON.parse(localStorage.getItem('everdistro_user'));

        async function init() {
            if (!user) return window.location.href = 'index.html';
            lucide.createIcons();
            try {
                const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
                
                const [profRes, relRes, whiteRes] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${user.id}&select=*`, { headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/releases?user_id=eq.${user.id}&select=*,tracks(*)&order=created_at.desc`, { headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/whitelist_requests?user_id=eq.${user.id}&select=*&limit=3`, { headers })
                ]);

                renderUI(await profRes.json(), await relRes.json(), await whiteRes.json());
            } catch (e) {
                console.error(e);
                renderUI([], [], []);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
                lucide.createIcons();
            }
        }

        function renderUI(profiles, releases, whitelist) {
            const profile = profiles[0];
            const name = profile?.full_name || user.email || "Artist";
            document.getElementById('userName').textContent = name;
            document.getElementById('welcomeGreeting').textContent = `Hi, ${name.split(' ')[0]}`;
            
            if (profile?.avatar_url) {
                document.getElementById('userAvatar').innerHTML = `<img src="${profile.avatar_url}" class="w-full h-full object-cover rounded-full">`;
            }

            let plays = 0;
            releases.forEach(r => r.tracks?.forEach(t => plays += (t.total_streams || 0)));

            const stats = [
                { label: 'Plays', val: plays.toLocaleString(), icon: 'play' },
                { label: 'Bank', val: '$0.00', icon: 'wallet' },
                { label: 'Music', val: releases.filter(r => r.status === 'approved').length, icon: 'check-circle' },
                { label: 'Review', val: releases.filter(r => r.status === 'pending').length, icon: 'clock' }
            ];

            document.getElementById('statsGrid').innerHTML = stats.map(s => `
                <div class="bg-[#0a0f1e] border border-white/5 p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-2">
                        <p class="text-[10px] font-bold uppercase text-slate-500 tracking-widest">${s.label}</p>
                        <i data-lucide="${s.icon}" class="w-4 h-4 text-blue-500"></i>
                    </div>
                    <p class="text-xl font-bold">${s.val}</p>
                </div>
            `).join('');

            const musicList = document.getElementById('musicList');
            if (releases.length === 0) {
                musicList.innerHTML = `<tr><td colspan="4" class="text-center py-20 text-slate-500 text-xs">No music distributed yet.</td></tr>`;
            } else {
                musicList.innerHTML = releases.slice(0, 5).map(r => `
                    <tr>
                        <td>
                            <div class="flex items-center gap-3">
                                <img src="${SUPABASE_URL}/storage/v1/object/public/artwork/${r.artwork_url}" class="w-9 h-9 rounded bg-slate-800 object-cover" onerror="this.style.opacity=0">
                                <span class="font-bold truncate max-w-[150px]">${r.title}</span>
                            </div>
                        </td>
                        <td><span class="status status-${r.status}">${r.status}</span></td>
                        <td class="hide-mobile text-slate-400 font-medium">${(r.tracks?.reduce((a,b)=>a+(b.total_streams||0),0) || 0).toLocaleString()}</td>
                        <td class="text-right text-slate-500 text-[11px] font-medium">${new Date(r.created_at).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            }

            const whiteBox = document.getElementById('whitelistBox');
            if (whitelist.length === 0) {
                whiteBox.innerHTML = `<p class="text-[10px] text-slate-500 text-center font-bold py-2">No rights active</p>`;
            } else {
                whiteBox.innerHTML = whitelist.map(w => `
                    <div class="flex items-center justify-between text-sm">
                        <span class="truncate pr-4 text-slate-300 font-medium">${w.channel_name || 'Channel'}</span>
                        <span class="text-[10px] font-bold text-blue-500 uppercase">${w.status}</span>
                    </div>
                `).join('');
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
        init();
    </script>
</body>
</html>
