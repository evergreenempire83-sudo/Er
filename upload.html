<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverDistro | CMS Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; -webkit-font-smoothing: antialiased; }
        .sidebar-link { transition: all 0.2s; color: #94a3b8; }
        .sidebar-link:hover, .sidebar-link.active { color: #fff; background: #0f172a; }
        
        /* Studio CMS Styling */
        .cms-card { background: #0a0f1e; border: 1px solid #1e293b; border-radius: 12px; }
        .studio-input { background: #050814; border: 1px solid #1e293b; border-radius: 8px; transition: 0.2s; color: white; font-size: 13px; }
        .studio-input:focus { border-color: #3b82f6; outline: none; background: #0a0f1e; }
        
        .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: #1e293b; transition: 0.3s; }
        .progress-dot.active { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

        .btn-studio-primary { background: #3b82f6; color: #fff; font-weight: 600; transition: 0.2s; }
        .btn-studio-primary:hover { background: #2563eb; }
        .btn-studio-secondary { background: #1e293b; border: 1px solid #334155; color: #fff; transition: 0.2s; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row">

    <!-- CMS Sidebar -->
    <aside class="hidden lg:flex w-64 flex-col bg-[#020617] border-r border-white/5 h-screen sticky top-0 p-6">
        <div class="flex items-center gap-2 mb-10 px-2">
            <img src="https://vinxbbpboupirnyxwghz.supabase.co/storage/v1/object/public/Ever-Music/file_00000000535c71f4a154bd2a598fddd0.png" class="h-6 w-auto">
            <span class="font-bold tracking-tight text-lg text-white">Studio Pro</span>
        </div>
        <nav class="space-y-1 flex-1 text-white">
            <p class="text-[10px] font-bold text-slate-500 uppercase px-3 mb-2 tracking-widest">Workspace</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="home" class="w-4 h-4"></i> Overview
            </a>
            <a href="upload.html" class="sidebar-link active flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i> Distribution
            </a>
            <a href="releases.html" class="sidebar-link flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="disc" class="w-4 h-4"></i> Asset Library
            </a>
        </nav>
        <button onclick="logout()" class="flex items-center gap-2 text-[11px] font-bold text-slate-500 uppercase hover:text-white pt-6 border-t border-white/5">
            <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
        </button>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 lg:p-8 max-w-5xl mx-auto w-full">
        
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-xl font-bold">Deliver New Asset</h1>
                <p class="text-xs text-slate-500 mt-1">Provide detailed metadata for global store delivery.</p>
            </div>
            <div class="flex gap-2">
                <div id="dot1" class="progress-dot active"></div>
                <div id="dot2" class="progress-dot"></div>
                <div id="dot3" class="progress-dot"></div>
            </div>
        </div>

        <!-- Step 1: Core Meta -->
        <div id="step1" class="space-y-6">
            <div class="cms-card p-6 space-y-8">
                <div class="flex items-center gap-2 bg-[#050814] p-1 rounded-lg border border-white/5 w-fit">
                    <button onclick="setType('single')" id="singleBtn" class="px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white">Single</button>
                    <button onclick="setType('album')" id="albumBtn" class="px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white">Album / EP</button>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Release Title</label>
                        <input type="text" id="releaseTitle" class="studio-input w-full px-4 py-3" placeholder="Project Title">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Primary Performer</label>
                        <input type="text" id="primaryArtist" class="studio-input w-full px-4 py-3" placeholder="Artist Name">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Main Genre</label>
                        <select id="genre" class="studio-input w-full px-4 py-3 appearance-none">
                            <option value="">Select Genre</option>
                            <optgroup label="Popular">
                                <option value="Afrobeat">Afrobeat</option>
                                <option value="Amapiano">Amapiano</option>
                                <option value="Hip-Hop">Hip-Hop / Rap</option>
                                <option value="Pop">Pop</option>
                                <option value="R&B">R&B / Soul</option>
                            </optgroup>
                            <optgroup label="Global">
                                <option value="Alternative">Alternative</option>
                                <option value="Electronic">Electronic</option>
                                <option value="Gospel">Gospel</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Delivery Date (Min 7 Days)</label>
                        <input type="date" id="releaseDate" class="studio-input w-full px-4 py-3">
                    </div>
                </div>
            </div>
            <div class="flex justify-end">
                <button onclick="goToStep2()" class="btn-studio-primary px-8 py-2.5 rounded-lg text-sm flex items-center gap-2">Next: Artwork <i data-lucide="chevron-right" class="w-4 h-4"></i></button>
            </div>
        </div>

        <!-- Step 2: Artwork -->
        <div id="step2" class="hidden space-y-6">
            <div class="cms-card p-12 text-center space-y-6">
                <div class="max-w-xs mx-auto space-y-4">
                    <div onclick="document.getElementById('artworkUpload').click()" id="artworkPreview" class="aspect-square bg-[#050814] border-2 border-dashed border-white/10 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition-all overflow-hidden group relative">
                        <i data-lucide="image-plus" class="w-8 h-8 text-slate-600 group-hover:text-blue-500 mb-2"></i>
                        <span class="text-[10px] font-bold text-slate-500 uppercase">3000 x 3000 JPG/PNG</span>
                    </div>
                    <input type="file" id="artworkUpload" class="hidden" accept="image/*" onchange="previewArtwork(event)">
                </div>
            </div>
            <div class="flex justify-between">
                <button onclick="goToStep1()" class="btn-studio-secondary px-6 py-2.5 rounded-lg text-sm">Back</button>
                <button onclick="goToStep3()" class="btn-studio-primary px-8 py-2.5 rounded-lg text-sm">Next: Tracks</button>
            </div>
        </div>

        <!-- Step 3: Tracks (FULL FEATURES) -->
        <div id="step3" class="hidden space-y-6 pb-20">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Asset Registry</h3>
                <button onclick="addNewTrack()" id="addTrackBtn" class="hidden btn-studio-secondary px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider">+ Add Record</button>
            </div>

            <div id="tracksContainer" class="space-y-6"></div>

            <!-- Content ID Protection -->
            <div class="cms-card p-6 bg-blue-500/5 border-blue-500/10 flex items-start gap-4">
                <input type="checkbox" id="globalContentId" class="mt-1 w-4 h-4 rounded border-white/10 bg-slate-900 text-blue-600 focus:ring-0">
                <div>
                    <label for="globalContentId" class="text-[11px] font-bold uppercase tracking-wider text-blue-100">Global Content ID Registry</label>
                    <p class="text-[10px] text-slate-500 mt-1">Enable automated fingerprinting for all tracks in this release.</p>
                </div>
            </div>

            <div class="flex justify-between items-center pt-6">
                <button onclick="goToStep2()" class="btn-studio-secondary px-6 py-2.5 rounded-lg text-sm">Back</button>
                <button onclick="submitRelease()" id="submitBtn" class="btn-studio-primary px-10 py-2.5 rounded-lg text-sm flex items-center gap-3">
                    <span id="submitText">Initialize Delivery</span>
                    <span id="submitLoader" class="hidden animate-spin"><i data-lucide="loader-2" class="w-4 h-4"></i></span>
                </button>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://nitppjssxvqjrtuyrbos.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdHBwanNzeHZxanJ0dXlyYm9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNzQyNjgsImV4cCI6MjA4NTg1MDI2OH0.O-2UWsBZrw8tyTCXhCcDNAhgY5Ro9_kZRlQoOSUGU3o';
        const currentUser = JSON.parse(localStorage.getItem('everdistro_user'));

        let releaseType = 'single';
        let artworkFile = null;
        let trackCounter = 0;

        window.onload = () => {
            if (!currentUser) window.location.href = 'index.html';
            lucide.createIcons();
            addNewTrack();
            const d = new Date(); d.setDate(d.getDate() + 7);
            document.getElementById('releaseDate').value = d.toISOString().split('T')[0];
        };

        function setType(type) {
            releaseType = type;
            document.getElementById('singleBtn').className = type === 'single' ? 'px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white' : 'px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white';
            document.getElementById('albumBtn').className = type === 'album' ? 'px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white' : 'px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white';
            document.getElementById('addTrackBtn').style.display = type === 'album' ? 'block' : 'none';
        }

        function addNewTrack() {
            trackCounter++;
            const container = document.getElementById('tracksContainer');
            const trackHtml = `
                <div class="cms-card p-6 asset-track-card space-y-6" id="track-card-${trackCounter}">
                    <div class="flex items-center justify-between border-b border-white/5 pb-4">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded bg-blue-600/10 text-blue-500 text-[10px] font-bold flex items-center justify-center">${trackCounter}</span>
                            <input type="text" class="track-title bg-transparent border-none outline-none font-bold text-sm w-full text-white" placeholder="Track Title">
                        </div>
                        ${trackCounter > 1 ? `<button onclick="this.closest('.asset-track-card').remove()" class="text-slate-500 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                    </div>
                    
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Audio File</label>
                                <div onclick="document.getElementById('audio-${trackCounter}').click()" class="studio-input p-3 cursor-pointer flex justify-between items-center">
                                    <span id="audio-name-${trackCounter}" class="text-[11px] text-slate-400">Select File</span>
                                    <i data-lucide="music" class="w-4 h-4 text-slate-600"></i>
                                </div>
                                <input type="file" id="audio-${trackCounter}" class="track-audio-file hidden" accept="audio/*" onchange="updateAudioName(${trackCounter}, this)">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Featured Performer(s)</label>
                                <input type="text" class="track-featured studio-input w-full p-3" placeholder="Separate with commas">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Producer(s)</label>
                                <input type="text" class="track-producer studio-input w-full p-3" placeholder="Music Producer">
                            </div>
                        </div>
                        <div class="space-y-4">
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Songwriter (Legal Name)</label>
                                <input type="text" class="track-songwriter studio-input w-full p-3" placeholder="Mandatory for Royalties">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Composer (Legal Name)</label>
                                <input type="text" class="track-composer studio-input w-full p-3" placeholder="Music Creator">
                            </div>
                            <div class="space-y-1.5">
                                <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">ISRC / Asset ID (Optional)</label>
                                <input type="text" class="track-isrc studio-input w-full p-3" placeholder="Leave empty for auto-assign">
                            </div>
                        </div>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', trackHtml);
            lucide.createIcons();
        }

        function updateAudioName(id, input) { document.getElementById(`audio-name-${id}`).innerText = input.files[0]?.name || "Select File"; }
        function previewArtwork(e) {
            artworkFile = e.target.files[0];
            if(artworkFile) {
                const reader = new FileReader();
                reader.onload = (ev) => document.getElementById('artworkPreview').innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover">`;
                reader.readAsDataURL(artworkFile);
            }
        }

        function goToStep1() { hideAll(); document.getElementById('step1').classList.remove('hidden'); setActiveDot(1); }
        function goToStep2() { if(!document.getElementById('releaseTitle').value) return alert("Title required"); hideAll(); document.getElementById('step2').classList.remove('hidden'); setActiveDot(2); }
        function goToStep3() { if(!artworkFile) return alert("Artwork required"); hideAll(); document.getElementById('step3').classList.remove('hidden'); setActiveDot(3); }
        function hideAll() { ['step1','step2','step3'].forEach(id => document.getElementById(id).classList.add('hidden')); }
        function setActiveDot(s) { ['dot1','dot2','dot3'].forEach((id, i) => document.getElementById(id).classList.toggle('active', i+1 === s)); }

        async function submitRelease() {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            document.getElementById('submitText').innerText = "Uploading Assets...";
            document.getElementById('submitLoader').classList.remove('hidden');

            try {
                // 1. Upload Artwork
                const artPath = `${currentUser.id}/${Date.now()}.jpg`;
                await fetch(`${SUPABASE_URL}/storage/v1/object/artwork/${artPath}`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                    body: artworkFile
                });

                // 2. Create Release
                const relRes = await fetch(`${SUPABASE_URL}/rest/v1/releases`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
                    body: JSON.stringify({
                        user_id: currentUser.id,
                        title: document.getElementById('releaseTitle').value,
                        primary_artist: document.getElementById('primaryArtist').value,
                        type: releaseType,
                        genre: document.getElementById('genre').value,
                        release_date: document.getElementById('releaseDate').value,
                        artwork_url: artPath,
                        status: 'pending'
                    })
                });
                const release = (await relRes.json())[0];

                // 3. Tracks (Save all metadata)
                const trackItems = document.querySelectorAll('.asset-track-card');
                for (const item of trackItems) {
                    const audioFile = item.querySelector('.track-audio-file').files[0];
                    let audioPath = null;
                    if (audioFile) {
                        audioPath = `${currentUser.id}/${Date.now()}_${audioFile.name}`;
                        await fetch(`${SUPABASE_URL}/storage/v1/object/audio-files/${audioPath}`, {
                            method: 'POST',
                            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                            body: audioFile
                        });
                    }

                    await fetch(`${SUPABASE_URL}/rest/v1/tracks`, {
                        method: 'POST',
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            release_id: release.id,
                            user_id: currentUser.id,
                            title: item.querySelector('.track-title').value,
                            featured_artist: item.querySelector('.track-featured').value,
                            producer: item.querySelector('.track-producer').value,
                            songwriter: item.querySelector('.track-songwriter').value,
                            composer: item.querySelector('.track-composer').value,
                            isrc: item.querySelector('.track-isrc').value,
                            audio_url: audioPath,
                            content_id_enabled: document.getElementById('globalContentId').checked
                        })
                    });
                }

                alert('Assets delivered for review.');
                window.location.href = 'releases.html';

            } catch (err) {
                alert('Upload error.');
                btn.disabled = false;
                document.getElementById('submitText').innerText = "Initialize Delivery";
                document.getElementById('submitLoader').classList.add('hidden');
            }
        }

        function logout() { localStorage.clear(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
