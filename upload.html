<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverDistro | CMS Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f1f5f9; -webkit-font-smoothing: antialiased; }
        .sidebar-link { transition: all 0.2s; color: #94a3b8; }
        .sidebar-link:hover, .sidebar-link.active { color: #fff; background: #0f172a; }
        
        /* Studio CMS Styling */
        .cms-card { background: #0a0f1e; border: 1px solid #1e293b; border-radius: 12px; }
        .studio-input { background: #050814; border: 1px solid #1e293b; border-radius: 8px; transition: 0.2s; color: white; font-size: 13px; }
        .studio-input:focus { border-color: #3b82f6; outline: none; background: #0a0f1e; }
        
        .progress-dot { width: 8px; height: 8px; border-radius: 50%; background: #1e293b; transition: 0.3s; }
        .progress-dot.active { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; }

        .btn-studio-primary { background: #3b82f6; color: #fff; font-weight: 600; transition: 0.2s; }
        .btn-studio-primary:hover { background: #2563eb; }
        .btn-studio-secondary { background: #1e293b; border: 1px solid #334155; color: #fff; transition: 0.2s; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        /* Debug panel */
        #debugPanel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }
        .debug-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 1001;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row">
    <!-- Debug Toggle Button -->
    <button class="debug-btn" onclick="toggleDebug()">🔍</button>
    
    <!-- Debug Panel -->
    <div id="debugPanel"></div>

    <!-- CMS Sidebar -->
    <aside class="hidden lg:flex w-64 flex-col bg-[#020617] border-r border-white/5 h-screen sticky top-0 p-6">
        <div class="flex items-center gap-2 mb-10 px-2">
            <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-lg text-white">E</div>
            <span class="font-bold tracking-tight text-lg text-white">Studio Pro</span>
        </div>
        <nav class="space-y-1 flex-1 text-white">
            <p class="text-[10px] font-bold text-slate-500 uppercase px-3 mb-2 tracking-widest">Workspace</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="home" class="w-4 h-4"></i> Overview
            </a>
            <a href="upload.html" class="sidebar-link active flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="upload-cloud" class="w-4 h-4"></i> Distribution
            </a>
            <a href="releases.html" class="sidebar-link flex items-center gap-3 p-2.5 rounded-lg text-sm">
                <i data-lucide="disc" class="w-4 h-4"></i> Asset Library
            </a>
        </nav>
        <button onclick="logout()" class="flex items-center gap-2 text-[11px] font-bold text-slate-500 uppercase hover:text-white pt-6 border-t border-white/5">
            <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
        </button>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 p-6 lg:p-8 max-w-5xl mx-auto w-full">
        
        <!-- Header & Progress -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-xl font-bold">Deliver New Asset</h1>
                <p class="text-xs text-slate-500 mt-1">Provide detailed metadata for global store delivery.</p>
            </div>
            <div class="flex gap-2">
                <div id="dot1" class="progress-dot active"></div>
                <div id="dot2" class="progress-dot"></div>
                <div id="dot3" class="progress-dot"></div>
            </div>
        </div>

        <!-- Step 1: Core Release Meta -->
        <div id="step1" class="space-y-6">
            <div class="cms-card p-6 space-y-8">
                <div class="flex items-center gap-2 bg-[#050814] p-1 rounded-lg border border-white/5 w-fit">
                    <button onclick="setType('single')" id="singleBtn" class="px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white">Single</button>
                    <button onclick="setType('album')" id="albumBtn" class="px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white">Album / EP</button>
                </div>

                <div class="grid md:grid-cols-2 gap-6">
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Release Title *</label>
                        <input type="text" id="releaseTitle" class="studio-input w-full px-4 py-3" placeholder="Project Title" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Primary Performer *</label>
                        <input type="text" id="primaryArtist" class="studio-input w-full px-4 py-3" placeholder="Artist Name" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Main Genre *</label>
                        <select id="genre" class="studio-input w-full px-4 py-3 appearance-none" required>
                            <option value="">Select Genre</option>
                            <option value="Hip-Hop">Hip-Hop / Rap</option>
                            <option value="Pop">Pop</option>
                            <option value="R&B">R&B / Soul</option>
                        </select>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Delivery Date (Min 7 Days) *</label>
                        <input type="date" id="releaseDate" class="studio-input w-full px-4 py-3" required>
                    </div>
                </div>

                <!-- Additional Artists Field -->
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Additional Artists (Optional)</label>
                    <input type="text" id="additionalArtists" class="studio-input w-full px-4 py-3" placeholder="Separate with commas">
                </div>

                <!-- Explicit Content Checkbox -->
                <div class="flex items-center gap-3">
                    <input type="checkbox" id="isExplicit" class="w-4 h-4 rounded border-white/10 bg-slate-900 text-blue-600 focus:ring-0">
                    <label for="isExplicit" class="text-sm text-slate-300">Contains explicit content</label>
                </div>
            </div>

            <div class="flex justify-end">
                <button onclick="goToStep2()" class="btn-studio-primary px-8 py-2.5 rounded-lg text-sm flex items-center gap-2">
                    Next: Artwork <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Step 2: Artwork Management -->
        <div id="step2" class="hidden space-y-6">
            <div class="cms-card p-12 text-center space-y-6">
                <div class="max-w-xs mx-auto space-y-4">
                    <div onclick="document.getElementById('artworkUpload').click()" id="artworkPreview" class="aspect-square bg-[#050814] border-2 border-dashed border-white/10 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 transition-all overflow-hidden group">
                        <i data-lucide="image-plus" class="w-8 h-8 text-slate-600 group-hover:text-blue-500 mb-2"></i>
                        <span class="text-[10px] font-bold text-slate-500 uppercase">3000 x 3000 JPG/PNG</span>
                    </div>
                    <input type="file" id="artworkUpload" class="hidden" accept="image/*" onchange="previewArtwork(event)" required>
                    <p class="text-[10px] text-slate-500 font-medium">Artwork must not contain logos, URLs, or blurred text.</p>
                </div>
            </div>

            <div class="flex justify-between">
                <button onclick="goToStep1()" class="btn-studio-secondary px-6 py-2.5 rounded-lg text-sm">Back</button>
                <button onclick="goToStep3()" class="btn-studio-primary px-8 py-2.5 rounded-lg text-sm flex items-center gap-2">
                    Next: Track Assets <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Step 3: Track Assets -->
        <div id="step3" class="hidden space-y-6 pb-20">
            <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Asset Registry</h3>
                <button onclick="addNewTrack()" id="addTrackBtn" class="hidden btn-studio-secondary px-4 py-1.5 rounded-md text-[10px] font-bold uppercase tracking-wider">+ Add Track</button>
            </div>

            <div id="tracksContainer" class="space-y-6">
                <!-- Tracks will be injected here -->
            </div>

            <div class="cms-card p-6 bg-blue-500/5 border-blue-500/10 flex items-start gap-4">
                <input type="checkbox" id="globalContentId" class="mt-1 w-4 h-4 rounded border-white/10 bg-slate-900 text-blue-600 focus:ring-0">
                <div>
                    <label for="globalContentId" class="text-[11px] font-bold uppercase tracking-wider text-blue-100">Global Content ID Registry</label>
                    <p class="text-[10px] text-slate-500 mt-1">Enable automated fingerprinting for all tracks in this release.</p>
                </div>
            </div>

            <div class="flex justify-between items-center pt-6">
                <button onclick="goToStep2()" class="btn-studio-secondary px-6 py-2.5 rounded-lg text-sm">Back</button>
                <button onclick="submitRelease()" id="submitBtn" class="btn-studio-primary px-10 py-2.5 rounded-lg text-sm flex items-center gap-3 shadow-xl shadow-blue-500/10">
                    <span id="submitText">Initialize Delivery</span>
                    <span id="submitLoader" class="hidden animate-spin"><i data-lucide="loader-2" class="w-4 h-4"></i></span>
                </button>
            </div>
        </div>
    </main>

<script>
    // ==================== DEBUG UTILITIES ====================
    const DEBUG = true;
    const debugLogs = [];
    
    function debugLog(message, data = null) {
        const timestamp = new Date().toLocaleTimeString();
        const logEntry = `[${timestamp}] ${message}`;
        
        if (DEBUG) {
            console.log(logEntry, data || '');
            debugLogs.push(logEntry);
            
            // Update debug panel
            const debugPanel = document.getElementById('debugPanel');
            if (debugPanel) {
                debugPanel.innerHTML = debugLogs.slice(-10).map(log => `<div>${log}</div>`).join('');
                debugPanel.scrollTop = debugPanel.scrollHeight;
            }
        }
    }
    
    function toggleDebug() {
        const panel = document.getElementById('debugPanel');
        if (panel) {
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
    }
    
    // ==================== INITIALIZATION ====================
    debugLog('Page loading...');
    
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Initialize Supabase
    const SUPABASE_URL = 'https://yuiazeclnawkdriahswj.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1aWF6ZWNsbmF3a2RyaWFoc3dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxOTE0ODAsImV4cCI6MjA4NTc2NzQ4MH0.ftF6Y0tehI4IWAFMDdEWqZU1zDmcbBfXbQPoXEczz54';
    
    let supabase;
    try {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        debugLog('Supabase initialized');
    } catch (error) {
        debugLog('ERROR: Failed to initialize Supabase', error);
        alert('Failed to initialize Supabase. Check console.');
    }
    
    let currentUser = null;
    let releaseType = 'single';
    let artworkFile = null;
    let trackCounter = 0;
    
    // ==================== PAGE LOAD ====================
    window.addEventListener('DOMContentLoaded', async () => {
        debugLog('DOM Content Loaded');
        
        // Set minimum release date
        const releaseDateInput = document.getElementById('releaseDate');
        if (releaseDateInput) {
            const minDate = new Date();
            minDate.setDate(minDate.getDate() + 7);
            const minStr = minDate.toISOString().split("T")[0];
            releaseDateInput.min = minStr;
            releaseDateInput.value = minStr;
            debugLog('Release date set to min:', minStr);
        }
        
        // Check authentication
        await checkAuth();
        
        // Add first track
        addNewTrack();
        
        debugLog('Page initialization complete');
    });
    
    // ==================== AUTHENTICATION ====================
    async function checkAuth() {
        debugLog('Checking authentication...');
        
        try {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            
            if (sessionError) {
                debugLog('ERROR: Session error', sessionError);
                alert('Session error: ' + sessionError.message);
                window.location.href = 'index.html';
                return;
            }
            
            if (!session) {
                debugLog('No session found, redirecting to login');
                window.location.href = 'index.html';
                return;
            }
            
            debugLog('User authenticated:', session.user.email);
            
            // Get or create user in database
            const { data: userData, error: userError } = await supabase
                .from('users')
                .select('*')
                .eq('auth_id', session.user.id)
                .single();
            
            if (userError && userError.code === 'PGRST116') {
                debugLog('User not found in database, creating...');
                
                const { data: newUser, error: createError } = await supabase
                    .from('users')
                    .insert({
                        auth_id: session.user.id,
                        email: session.user.email,
                        display_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0],
                        label_name: session.user.user_metadata?.full_name || session.user.email.split('@')[0] + ' Label',
                        role: 'creator',
                        account_status: 'active'
                    })
                    .select()
                    .single();
                
                if (createError) {
                    debugLog('ERROR: Failed to create user', createError);
                    alert('Failed to create user account: ' + createError.message);
                    return;
                }
                
                currentUser = newUser;
                debugLog('User created:', currentUser.id);
                
            } else if (userError) {
                debugLog('ERROR: Failed to fetch user', userError);
                alert('Failed to fetch user: ' + userError.message);
                return;
            } else {
                currentUser = userData;
                debugLog('User found:', currentUser.id);
                
                if (currentUser.account_status !== 'active') {
                    debugLog('Account not active:', currentUser.account_status);
                    alert(`Account is ${currentUser.account_status}. Contact support.`);
                    window.location.href = 'index.html';
                    return;
                }
            }
            
        } catch (error) {
            debugLog('ERROR: Authentication failed', error);
            alert('Authentication failed: ' + error.message);
            window.location.href = 'index.html';
        }
    }
    
    // ==================== FORM NAVIGATION ====================
    function setType(type) {
        debugLog('Setting release type to:', type);
        releaseType = type;
        
        const singleBtn = document.getElementById('singleBtn');
        const albumBtn = document.getElementById('albumBtn');
        const addTrackBtn = document.getElementById('addTrackBtn');
        
        if (type === 'single') {
            singleBtn.className = 'px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white';
            albumBtn.className = 'px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white';
            addTrackBtn.style.display = 'none';
            
            // Remove extra tracks if switching from album to single
            const tracks = document.querySelectorAll('.asset-track-card');
            if (tracks.length > 1) {
                debugLog('Removing extra tracks for single');
                for(let i = 1; i < tracks.length; i++) {
                    tracks[i].remove();
                }
                trackCounter = 1;
                const firstTrack = document.querySelector('.asset-track-card');
                if (firstTrack) {
                    const trackNumberSpan = firstTrack.querySelector('.w-6.h-6');
                    if (trackNumberSpan) trackNumberSpan.textContent = '1';
                }
            }
        } else {
            singleBtn.className = 'px-6 py-1.5 rounded-md text-xs font-bold transition-all text-slate-500 hover:text-white';
            albumBtn.className = 'px-6 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-600 text-white';
            addTrackBtn.style.display = 'block';
        }
    }
    
    function goToStep1() { 
        debugLog('Going to Step 1');
        hideAll(); 
        document.getElementById('step1').classList.remove('hidden'); 
        setActiveDot(1); 
    }
    
    function goToStep2() { 
        debugLog('Validating Step 1...');
        
        const title = document.getElementById('releaseTitle')?.value.trim();
        const genre = document.getElementById('genre')?.value;
        const artist = document.getElementById('primaryArtist')?.value.trim();
        
        debugLog('Form values:', { title, genre, artist });
        
        if(!title) {
            debugLog('ERROR: Release title required');
            alert("Release title is required.");
            return;
        }
        if(!genre) {
            debugLog('ERROR: Genre required');
            alert("Please select a genre.");
            return;
        }
        if(!artist) {
            debugLog('ERROR: Primary artist required');
            alert("Primary artist is required.");
            return;
        }
        
        debugLog('Step 1 validation passed');
        hideAll(); 
        document.getElementById('step2').classList.remove('hidden'); 
        setActiveDot(2); 
    }
    
    function goToStep3() { 
        debugLog('Validating Step 2...');
        
        if(!artworkFile) {
            debugLog('ERROR: Artwork file required');
            alert("Cover art is required.");
            return;
        }
        
        // Validate art cover dimensions
        debugLog('Validating artwork dimensions...');
        const img = new Image();
        img.src = URL.createObjectURL(artworkFile);
        
        img.onload = () => {
            URL.revokeObjectURL(img.src);
            if (img.width !== 3000 || img.height !== 3000) {
                debugLog(`ERROR: Artwork dimensions invalid: ${img.width}x${img.height}`);
                alert(`Art cover must be exactly 3000x3000 pixels. Current: ${img.width}x${img.height}`);
                return;
            }
            debugLog('Artwork validation passed');
            hideAll(); 
            document.getElementById('step3').classList.remove('hidden'); 
            setActiveDot(3);
        };
        
        img.onerror = () => {
            URL.revokeObjectURL(img.src);
            debugLog('ERROR: Failed to load artwork image');
            alert('Error loading image. Please try another file.');
        };
    }
    
    function hideAll() { 
        ['step1','step2','step3'].forEach(id => {
            const element = document.getElementById(id);
            if (element) element.classList.add('hidden');
        }); 
    }
    
    function setActiveDot(step) { 
        ['dot1','dot2','dot3'].forEach((id, i) => {
            const dot = document.getElementById(id);
            if (dot) dot.classList.toggle('active', i + 1 === step);
        }); 
    }
    
    // ==================== TRACK MANAGEMENT ====================
    function addNewTrack() {
        trackCounter++;
        debugLog(`Adding track ${trackCounter}`);
        
        const container = document.getElementById('tracksContainer');
        const trackHtml = `
            <div class="cms-card p-6 asset-track-card space-y-6" id="track-card-${trackCounter}">
                <div class="flex items-center justify-between border-b border-white/5 pb-4">
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded bg-blue-600/10 text-blue-500 text-[10px] font-bold flex items-center justify-center">${trackCounter}</span>
                        <input type="text" class="track-title studio-input bg-transparent border-none outline-none font-bold text-sm w-full text-white" placeholder="Track Title *" required>
                    </div>
                    ${trackCounter > 1 ? `<button type="button" onclick="removeTrack(${trackCounter})" class="text-slate-500 hover:text-rose-500"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                </div>
                
                <div class="grid md:grid-cols-2 gap-8">
                    <!-- Audio File -->
                    <div class="space-y-4">
                        <div class="space-y-1.5">
                            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Audio File (MP3 Only) *</label>
                            <div onclick="document.getElementById('audio-${trackCounter}').click()" class="studio-input p-3 cursor-pointer flex justify-between items-center">
                                <span id="audio-name-${trackCounter}" class="text-[11px] text-slate-400 truncate">Select MP3 File</span>
                                <i data-lucide="music" class="w-4 h-4 text-slate-600"></i>
                            </div>
                            <input type="file" id="audio-${trackCounter}" class="track-audio-file hidden" accept="audio/mpeg,.mp3" onchange="updateAudioName(${trackCounter}, this)" required>
                            <p class="text-[9px] text-slate-500">MP3 format only, max 100MB</p>
                        </div>
                    </div>

                    <!-- Track Info -->
                    <div class="space-y-4">
                        <div class="space-y-1.5">
                            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Duration (seconds) *</label>
                            <input type="number" class="track-duration studio-input w-full p-3" placeholder="180" min="30" max="3600" required>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Explicit Content</label>
                            <select class="track-explicit studio-input w-full p-3">
                                <option value="false">No</option>
                                <option value="true">Yes</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        container.insertAdjacentHTML('beforeend', trackHtml);
        lucide.createIcons();
        debugLog(`Track ${trackCounter} added`);
    }
    
    function removeTrack(id) {
        debugLog(`Removing track ${id}`);
        const trackElement = document.getElementById(`track-card-${id}`);
        if (trackElement) {
            trackElement.remove();
            
            // Renumber remaining tracks
            const tracks = document.querySelectorAll('.asset-track-card');
            tracks.forEach((track, index) => {
                const trackNumber = index + 1;
                const trackNumberSpan = track.querySelector('.w-6.h-6');
                if (trackNumberSpan) trackNumberSpan.textContent = trackNumber;
                
                // Update IDs
                track.id = `track-card-${trackNumber}`;
                const fileInput = track.querySelector('.track-audio-file');
                if (fileInput) {
                    fileInput.id = `audio-${trackNumber}`;
                    fileInput.onchange = (e) => updateAudioName(trackNumber, e.target);
                }
                const audioName = track.querySelector(`[id^="audio-name-"]`);
                if (audioName) audioName.id = `audio-name-${trackNumber}`;
                
                // Update remove button
                const removeBtn = track.querySelector('button[onclick*="removeTrack"]');
                if (removeBtn) {
                    if (trackNumber === 1) {
                        removeBtn.remove();
                    } else {
                        removeBtn.onclick = () => removeTrack(trackNumber);
                    }
                }
            });
            trackCounter = tracks.length;
            debugLog(`Tracks renumbered. Now ${trackCounter} tracks`);
        }
    }
    
    function updateAudioName(id, input) {
        const file = input.files[0];
        if (file) {
            debugLog(`Audio file selected for track ${id}:`, file.name);
            
            // Validate MP3
            if (!file.type.includes('audio/mpeg') && !file.name.toLowerCase().endsWith('.mp3')) {
                debugLog('ERROR: Not an MP3 file');
                alert('Please upload MP3 files only');
                input.value = '';
                document.getElementById(`audio-name-${id}`).innerText = "Select MP3 File";
                return;
            }
            
            // Validate size (100MB max)
            if (file.size > 100 * 1024 * 1024) {
                debugLog('ERROR: File too large');
                alert('File too large. Max 100MB');
                input.value = '';
                document.getElementById(`audio-name-${id}`).innerText = "Select MP3 File";
                return;
            }
            
            document.getElementById(`audio-name-${id}`).innerText = file.name;
            
            // Get audio duration
            const audio = new Audio();
            audio.src = URL.createObjectURL(file);
            audio.onloadedmetadata = () => {
                const durationInput = document.querySelector(`#track-card-${id} .track-duration`);
                if (durationInput && !durationInput.value) {
                    durationInput.value = Math.round(audio.duration);
                    debugLog(`Auto-filled duration: ${durationInput.value} seconds`);
                }
                URL.revokeObjectURL(audio.src);
            };
            audio.onerror = () => {
                debugLog('ERROR: Failed to get audio duration');
                URL.revokeObjectURL(audio.src);
            };
        }
    }
    
    function previewArtwork(e) {
        const file = e.target.files[0];
        if (!file) {
            debugLog('No artwork file selected');
            return;
        }
        
        debugLog('Artwork file selected:', file.name);
        
        // Validate image type
        if (!file.type.includes('image/jpeg') && !file.type.includes('image/png')) {
            debugLog('ERROR: Not a JPG/PNG file');
            alert('Please upload JPG or PNG files only');
            e.target.value = '';
            return;
        }
        
        // Validate size
        if (file.size > 10 * 1024 * 1024) {
            debugLog('ERROR: Artwork file too large');
            alert('Image too large. Max 10MB');
            e.target.value = '';
            return;
        }
        
        artworkFile = file;
        const reader = new FileReader();
        
        reader.onload = (ev) => {
            const preview = document.getElementById('artworkPreview');
            if (preview) {
                preview.innerHTML = `
                    <img src="${ev.target.result}" class="w-full h-full object-cover rounded-xl">
                    <div class="absolute bottom-2 right-2 bg-black/70 text-[10px] px-2 py-1 rounded">
                        ${file.name}
                    </div>
                `;
                preview.classList.remove('flex', 'flex-col', 'items-center', 'justify-center');
                debugLog('Artwork preview updated');
            }
        };
        
        reader.onerror = () => {
            debugLog('ERROR: Failed to read artwork file');
            alert('Error reading file. Please try another image.');
        };
        
        reader.readAsDataURL(file);
    }
    
    // ==================== UPLOAD FUNCTIONS ====================
    async function uploadArtCover(file) {
        try {
            debugLog('Starting art cover upload...');
            
            const fileName = `art-${Date.now()}-${file.name.replace(/\s+/g, '-').toLowerCase()}`;
            const filePath = `art-covers/${currentUser.id}/${fileName}`;
            
            debugLog(`Uploading to: ${filePath}`);
            
            const { data, error } = await supabase.storage
                .from('art-covers')
                .upload(filePath, file, {
                    contentType: file.type,
                    upsert: false
                });
            
            if (error) {
                debugLog('ERROR: Art cover upload failed', error);
                throw error;
            }
            
            const { data: { publicUrl } } = supabase.storage
                .from('art-covers')
                .getPublicUrl(filePath);
            
            debugLog('Art cover upload successful:', publicUrl);
                
            return {
                url: publicUrl,
                path: filePath,
                width: 3000,
                height: 3000,
                verified: true
            };
            
        } catch (error) {
            debugLog('FATAL: Art cover upload failed', error);
            throw new Error('Failed to upload art cover: ' + error.message);
        }
    }
    
    async function uploadAudioFile(file, releaseId, trackNumber) {
        try {
            debugLog(`Starting audio upload for track ${trackNumber}...`);
            
            const fileName = `audio-${releaseId}-track-${trackNumber}-${Date.now()}.mp3`;
            const filePath = `audio-uploads/${currentUser.id}/${fileName}`;
            
            debugLog(`Uploading to: ${filePath}`);
            
            const { data, error } = await supabase.storage
                .from('audio-uploads')
                .upload(filePath, file, {
                    contentType: 'audio/mpeg',
                    upsert: false
                });
            
            if (error) {
                debugLog('ERROR: Audio upload failed', error);
                throw error;
            }
            
            // Get audio duration
            const duration = await getAudioDuration(file);
            debugLog(`Audio duration: ${duration} seconds`);
            
            return {
                path: filePath,
                fileName: fileName,
                originalName: file.name,
                fileSize: file.size,
                duration: duration
            };
            
        } catch (error) {
            debugLog('FATAL: Audio upload failed', error);
            throw new Error('Failed to upload audio: ' + error.message);
        }
    }
    
    function getAudioDuration(file) {
        return new Promise((resolve) => {
            const audio = new Audio();
            audio.src = URL.createObjectURL(file);
            
            audio.onloadedmetadata = () => {
                const duration = Math.round(audio.duration);
                debugLog(`Audio metadata loaded: ${duration} seconds`);
                URL.revokeObjectURL(audio.src);
                resolve(duration);
            };
            
            audio.onerror = () => {
                debugLog('WARN: Could not get audio duration, using default');
                URL.revokeObjectURL(audio.src);
                resolve(180); // Default 3 minutes
            };
        });
    }
    
    // ==================== SUBMIT RELEASE ====================
    async function submitRelease() {
        debugLog('========== STARTING RELEASE SUBMISSION ==========');
        
        const btn = document.getElementById('submitBtn');
        const trackItems = document.querySelectorAll('.asset-track-card');
        
        debugLog(`Found ${trackItems.length} track(s)`);
        
        // Validate all tracks
        for (let i = 0; i < trackItems.length; i++) {
            const item = trackItems[i];
            const title = item.querySelector('.track-title')?.value.trim();
            const audioFile = item.querySelector('.track-audio-file')?.files[0];
            
            debugLog(`Validating track ${i + 1}:`, { title, hasAudio: !!audioFile });
            
            if (!title) {
                debugLog(`ERROR: Track ${i + 1} missing title`);
                alert(`Please enter a title for track ${i + 1}`);
                return;
            }
            if (!audioFile) {
                debugLog(`ERROR: Track ${i + 1} missing audio`);
                alert(`Please upload audio for track: ${title || 'Untitled'}`);
                return;
            }
        }
        
        btn.disabled = true;
        document.getElementById('submitText').innerText = "Processing...";
        document.getElementById('submitLoader').classList.remove('hidden');
        
        try {
            // 1. Upload Art Cover
            debugLog('Step 1: Uploading art cover...');
            const artData = await uploadArtCover(artworkFile);
            
            // 2. Create Release Record
            debugLog('Step 2: Creating release record...');
            
            const releaseData = {
                user_id: currentUser.id,
                type: releaseType,
                status: 'pending',
                title: document.getElementById('releaseTitle').value.trim(),
                primary_artist: document.getElementById('primaryArtist').value.trim(),
                additional_artists: document.getElementById('additionalArtists').value 
                    ? document.getElementById('additionalArtists').value.split(',').map(a => a.trim()).filter(a => a)
                    : [],
                release_date: document.getElementById('releaseDate').value,
                genre: document.getElementById('genre').value,
                sub_genre: null,
                is_explicit: document.getElementById('isExplicit').checked,
                global_content_id_enabled: document.getElementById('globalContentId').checked,
                
                // Art Cover
                art_cover_url: artData.url,
                art_cover_storage_path: artData.path,
                art_cover_width: artData.width,
                art_cover_height: artData.height,
                art_cover_verified: artData.verified,
                
                // Audio info
                audio_storage_path: null,
                audio_file_name: null,
                audio_original_name: null,
                audio_file_size: null,
                audio_duration: null,
                audio_secured: false
            };
            
            debugLog('Release data to insert:', releaseData);
            
            const { data: release, error: releaseError } = await supabase
                .from('releases')
                .insert(releaseData)
                .select()
                .single();
            
            if (releaseError) {
                debugLog('ERROR: Release creation failed', releaseError);
                throw releaseError;
            }
            
            debugLog('✅ Release created:', release.id);
            
            // 3. Process Tracks
            debugLog(`Step 3: Processing ${trackItems.length} track(s)...`);
            
            let trackNumber = 1;
            for (const item of trackItems) {
                const audioFile = item.querySelector('.track-audio-file').files[0];
                debugLog(`Uploading audio for track ${trackNumber}...`);
                
                const audioData = await uploadAudioFile(audioFile, release.id, trackNumber);
                
                // Create Track Record
                const trackData = {
                    release_id: release.id,
                    track_number: trackNumber,
                    title: item.querySelector('.track-title').value.trim(),
                    duration: parseInt(item.querySelector('.track-duration').value) || audioData.duration,
                    featured_artists: item.querySelector('.track-featured')?.value 
                        ? item.querySelector('.track-featured').value.split(',').map(a => a.trim()).filter(a => a)
                        : [],
                    is_explicit: item.querySelector('.track-explicit').value === 'true',
                    genre: item.querySelector('.track-genre')?.value || document.getElementById('genre').value,
                    
                    // Audio File
                    audio_storage_path: audioData.path,
                    audio_file_name: audioData.fileName,
                    audio_original_name: audioData.originalName,
                    audio_file_size: audioData.fileSize,
                    audio_duration_seconds: audioData.duration,
                    audio_secured: false,
                    
                    // Ordering
                    display_order: trackNumber
                };
                
                debugLog(`Track ${trackNumber} data:`, trackData);
                
                const { error: trackError } = await supabase
                    .from('tracks')
                    .insert(trackData);
                
                if (trackError) {
                    debugLog(`ERROR: Track ${trackNumber} creation failed`, trackError);
                    throw trackError;
                }
                
                debugLog(`✅ Track ${trackNumber} created successfully`);
                trackNumber++;
            }
            
            // 4. If single, update release with first track's audio info
            if (releaseType === 'single' && trackItems.length > 0) {
                debugLog('Updating single release with audio info...');
                const firstTrack = trackItems[0];
                const audioFile = firstTrack.querySelector('.track-audio-file').files[0];
                const audioData = await getAudioDuration(audioFile);
                
                await supabase
                    .from('releases')
                    .update({
                        audio_storage_path: `audio-uploads/${currentUser.id}/single-${release.id}.mp3`,
                        audio_file_name: audioFile.name,
                        audio_original_name: audioFile.name,
                        audio_file_size: audioFile.size,
                        audio_duration: audioData
                    })
                    .eq('id', release.id);
                
                debugLog('✅ Single release updated with audio info');
            }
            
            // Success!
            debugLog('========== RELEASE SUBMISSION COMPLETE ==========');
            alert('✅ Release submitted successfully! It will be reviewed within 24-48 hours.');
            window.location.href = 'dashboard.html';
            
        } catch (error) {
            debugLog('========== SUBMISSION FAILED ==========', error);
            
            let errorMessage = 'Error submitting release. ';
            if (error.message.includes('permission denied')) {
                errorMessage += 'Permission denied. Check RLS policies.';
                debugLog('RLS POLICY ISSUE - Run this SQL in Supabase:');
                debugLog('ALTER TABLE releases DISABLE ROW LEVEL SECURITY;');
                debugLog('ALTER TABLE tracks DISABLE ROW LEVEL SECURITY;');
                debugLog('ALTER TABLE users DISABLE ROW LEVEL SECURITY;');
            } else if (error.message.includes('network')) {
                errorMessage += 'Network error. Check connection.';
            } else if (error.code) {
                errorMessage += `Error code: ${error.code}. Message: ${error.message}`;
            } else {
                errorMessage += error.message;
            }
            
            alert(errorMessage);
            
            // Reset button
            btn.disabled = false;
            document.getElementById('submitText').innerText = "Initialize Delivery";
            document.getElementById('submitLoader').classList.add('hidden');
        }
    }
    
    function logout() {
        debugLog('Logging out...');
        supabase.auth.signOut();
        window.location.href = 'index.html';
    }
    
    // ==================== QUICK FIX BUTTON ====================
    // Add this button for testing
    document.addEventListener('DOMContentLoaded', () => {
        const quickFixBtn = document.createElement('button');
        quickFixBtn.textContent = '🛠️ Quick Fix';
        quickFixBtn.className = 'fixed bottom-20 right-5 bg-red-500 text-white p-2 rounded text-xs z-50';
        quickFixBtn.onclick = async () => {
            debugLog('Running quick fix...');
            
            // Test database connection
            try {
                const { data, error } = await supabase
                    .from('users')
                    .select('count')
                    .limit(1);
                
                if (error) {
                    debugLog('Database test failed:', error);
                    alert('Database error: ' + error.message);
                } else {
                    debugLog('Database test passed');
                    alert('Database connection OK!');
                }
            } catch (err) {
                debugLog('Quick fix test failed:', err);
            }
        };
        document.body.appendChild(quickFixBtn);
    });
    
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            submitRelease();
        }
        if (e.key === 'Escape') {
            window.location.href = 'dashboard.html';
        }
        if (e.ctrlKey && e.key === 'd') {
            e.preventDefault();
            toggleDebug();
        }
    });
</script>
