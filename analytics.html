<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverDistro | Channel Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f8fafc; -webkit-font-smoothing: antialiased; }
        .container-slim { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
        .yt-card { background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; overflow: hidden; }
        .stat-box { padding: 1.5rem; border-bottom: 3px solid transparent; cursor: pointer; transition: all 0.2s; }
        .stat-box.active { background: rgba(59, 130, 246, 0.05); border-bottom-color: #3b82f6; }
        .stat-box:hover:not(.active) { background: rgba(255,255,255,0.02); }
        .nav-breadcrumb { display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 13px; margin-bottom: 1.5rem; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container-slim">
        <nav class="nav-breadcrumb">
            <a href="dashboard.html" class="hover:text-white transition-colors">Dashboard</a>
            <i data-lucide="chevron-right" class="w-3 h-3"></i>
            <span class="text-white font-medium">Analytics</span>
        </nav>

        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <h1 class="text-2xl font-semibold tracking-tight">Channel analytics</h1>
            <div class="flex items-center gap-2">
                <!-- Updated Time Range to Months -->
                <select id="timeRange" onchange="loadAnalytics()" class="bg-[#1e293b] text-xs font-medium px-3 py-2 rounded-md border-none outline-none ring-1 ring-white/10">
                    <option value="3">Last 3 months</option>
                    <option value="6" selected>Last 6 months</option>
                    <option value="12">Last 12 months</option>
                    <option value="ytd">Year to date</option>
                </select>
            </div>
        </div>

        <div id="loader" class="h-64 flex flex-col items-center justify-center gap-3">
            <div class="w-5 h-5 border-2 border-slate-500 border-t-blue-500 rounded-full animate-spin"></div>
            <p class="text-xs text-slate-500 font-medium">Aggregating monthly data...</p>
        </div>

        <div id="content" class="hidden space-y-6">
            <div class="yt-card">
                <div class="grid grid-cols-1 md:grid-cols-3 border-b border-white/5">
                    <div class="stat-box active">
                        <p class="text-xs text-slate-400 mb-1">Total Streams</p>
                        <h2 id="total-streams" class="text-xl font-bold">0</h2>
                    </div>
                    <div class="stat-box">
                        <p class="text-xs text-slate-400 mb-1">Estimated revenue</p>
                        <h2 id="total-revenue" class="text-xl font-bold">$0.00</h2>
                    </div>
                    <div class="stat-box">
                        <p class="text-xs text-slate-400 mb-1">Avg Release Quality</p>
                        <h2 id="avg-health" class="text-xl font-bold text-blue-400">0%</h2>
                    </div>
                </div>

                <div class="p-6">
                    <div class="h-[340px] w-full">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="yt-card">
                    <div class="p-5 border-b border-white/5">
                        <h3 class="text-sm font-semibold">Top releases</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5">Monthly performance</p>
                    </div>
                    <div id="topContent" class="divide-y divide-white/5"></div>
                </div>

                <div class="yt-card">
                    <div class="p-5 border-b border-white/5">
                        <h3 class="text-sm font-semibold">Latest audit results</h3>
                        <p class="text-[11px] text-slate-500 mt-0.5">Distribution readiness</p>
                    </div>
                    <div id="qualityLog" class="p-5 space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://nitppjssxvqjrtuyrbos.supabase.co';
        const SUPABASE_KEY = 'YOUR_KEY_HERE';
        const { createClient } = window.supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const user = JSON.parse(localStorage.getItem('everdistro_user'));
        let chart;

        async function init() {
            if (!user) return window.location.href = 'index.html';
            lucide.createIcons();
            await loadAnalytics();
        }

        async function loadAnalytics() {
            const rangeType = document.getElementById('timeRange').value;
            const dateLimit = new Date();
            
            if(rangeType === 'ytd') {
                dateLimit.setMonth(0, 1); // Jan 1st of current year
            } else {
                dateLimit.setMonth(dateLimit.getMonth() - parseInt(rangeType));
                dateLimit.setDate(1); // Start of that month
            }
            
            try {
                // Fetch daily metrics to aggregate into months
                const { data: daily } = await _supabase
                    .from('daily_release_metrics')
                    .select('*, releases!inner(title, artwork_url, user_id)')
                    .eq('releases.user_id', user.id)
                    .gte('metric_date', dateLimit.toISOString().split('T')[0])
                    .order('metric_date', { ascending: true });

                const { data: scores } = await _supabase
                    .from('release_performance_scores')
                    .select('*, releases!inner(title, user_id)')
                    .eq('releases.user_id', user.id)
                    .order('calculated_at', { ascending: false })
                    .limit(3);

                renderUI(daily, scores);
            } catch (err) {
                console.error("Data error:", err);
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            }
        }

        function renderUI(daily, scores) {
            const streams = daily.reduce((a, b) => a + (b.total_streams || 0), 0);
            const revenue = daily.reduce((a, b) => a + parseFloat(b.revenue_usd || 0), 0);
            const health = scores.length > 0 ? (scores.reduce((a, b) => a + b.overall_score, 0) / scores.length).toFixed(0) : 0;

            document.getElementById('total-streams').textContent = streams.toLocaleString();
            document.getElementById('total-revenue').textContent = `$${revenue.toFixed(2)}`;
            document.getElementById('avg-health').textContent = `${health}%`;

            // GROUP DATA BY MONTH
            const monthlyData = {};
            daily.forEach(d => {
                const date = new Date(d.metric_date);
                // Create key like "Jan 2024"
                const monthLabel = date.toLocaleDateString('en-US', { month: 'short' });
                
                if (!monthlyData[monthLabel]) {
                    monthlyData[monthLabel] = 0;
                }
                monthlyData[monthLabel] += d.total_streams;
            });

            renderChart(Object.keys(monthlyData), Object.values(monthlyData));
            renderTopContent(daily);
            renderQualityScores(scores);
        }

        function renderChart(labels, data) {
            if (chart) chart.destroy();
            const ctx = document.getElementById('performanceChart').getContext('2d');
            
            chart = new Chart(ctx, {
                type: 'bar', // Bar chart often looks better for monthly comparisons
                data: {
                    labels,
                    datasets: [{
                        label: 'Streams',
                        data,
                        backgroundColor: '#3b82f6',
                        borderRadius: 4,
                        hoverBackgroundColor: '#60a5fa'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { 
                            grid: { color: 'rgba(255,255,255,0.05)', drawBorder: false }, 
                            ticks: { color: '#64748b', font: { size: 10 } } 
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#64748b', font: { size: 11, weight: '500' } } 
                        }
                    }
                }
            });
        }

        function renderTopContent(daily) {
            const list = document.getElementById('topContent');
            const grouped = {};
            
            daily.forEach(d => {
                if(!grouped[d.release_id]) {
                    grouped[d.release_id] = { title: d.releases.title, art: d.releases.artwork_url, val: 0 };
                }
                grouped[d.release_id].val += d.total_streams;
            });

            const sorted = Object.values(grouped).sort((a,b) => b.val - a.val).slice(0, 5);
            
            if(sorted.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-10">No data for this period.</p>`;
                return;
            }

            list.innerHTML = sorted.map(item => `
                <div class="flex items-center justify-between p-4 hover:bg-white/[0.02] transition-colors">
                    <div class="flex items-center gap-3">
                        <img src="${SUPABASE_URL}/storage/v1/object/public/artwork/${item.art}" class="w-8 h-8 rounded bg-slate-800 object-cover">
                        <span class="text-xs font-medium">${item.title}</span>
                    </div>
                    <span class="text-xs font-semibold">${item.val.toLocaleString()}</span>
                </div>
            `).join('');
        }

        function renderQualityScores(scores) {
            const list = document.getElementById('qualityLog');
            if (scores.length === 0) {
                list.innerHTML = `<p class="text-xs text-slate-500 text-center py-10">No audit data available yet.</p>`;
                return;
            }

            list.innerHTML = scores.map(s => `
                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="font-medium">${s.releases.title}</span>
                        <span class="text-blue-400 font-bold">${s.overall_score}%</span>
                    </div>
                    <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-500" style="width: ${s.overall_score}%"></div>
                    </div>
                    <div class="flex gap-4">
                        <span class="text-[9px] text-slate-500 uppercase font-bold">Metadata: ${s.metadata_score}</span>
                        <span class="text-[9px] text-slate-500 uppercase font-bold">Compliance: ${s.compliance_score}</span>
                    </div>
                </div>
            `).join('');
        }

        init();
    </script>
</body>
</html>
