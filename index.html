<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EverDistro | Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
        }
        .input-field {
            background: #0f172a;
            border: 1px solid #1e293b;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: #3b82f6;
            background: #1e293b;
            outline: none;
        }
        .btn-main {
            background: #ffffff;
            color: #020617;
            transition: all 0.2s;
        }
        .btn-main:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }
        .btn-main:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-[320px] flex flex-col items-center">
        
        <!-- Branding -->
        <div class="flex flex-col items-center mb-10">
            <img src="https://vinxbbpboupirnyxwghz.supabase.co/storage/v1/object/public/Ever-Music/file_00000000535c71f4a154bd2a598fddd0.png" 
                 alt="Logo" 
                 class="h-10 w-auto mb-3">
            <h1 class="text-xl font-bold tracking-tight">EverDistro</h1>
        </div>

        <!-- Login Section -->
        <div class="w-full">
            <!-- Simple Error Display -->
            <div id="errorMessage" class="hidden text-center text-rose-400 text-[12px] font-medium mb-4 p-2 bg-rose-500/10 rounded-lg border border-rose-500/20">
                Invalid credentials.
            </div>

            <form id="loginForm" class="space-y-3">
                <div class="space-y-1">
                    <input 
                        type="email" 
                        id="email"
                        class="input-field w-full px-4 py-3 rounded-xl text-sm placeholder:text-slate-500" 
                        placeholder="Email" 
                        required
                    />
                </div>
                
                <div class="relative">
                    <input 
                        type="password" 
                        id="password"
                        class="input-field w-full px-4 py-3 rounded-xl text-sm placeholder:text-slate-500" 
                        placeholder="Password" 
                        required
                    />
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-white">
                        <i data-lucide="eye" id="eyeIcon" class="w-4 h-4"></i>
                    </button>
                </div>

                <button type="submit" id="submitBtn" class="btn-main w-full py-3 rounded-xl text-sm font-semibold mt-2 flex justify-center items-center">
                    <span id="loginText">Sign in</span>
                    <span id="loginLoader" class="hidden animate-spin"><i data-lucide="loader-2" class="w-5 h-5"></i></span>
                </button>
            </form>

            <!-- Quick Links -->
            <div class="mt-8 flex flex-col items-center gap-4">
                <a href="#" class="text-[12px] text-slate-500 hover:text-white transition-colors">Forgot password?</a>
                <a href="register.html" class="text-[12px] text-white font-medium hover:underline underline-offset-4">Create account</a>
            </div>
        </div>
    </div>

    <!-- Static Footer -->
    <footer class="fixed bottom-8 text-[11px] text-slate-600 font-medium">
        &copy; 2025 EverDistro
    </footer>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Supabase Config
        const SUPABASE_URL = 'https://nitppjssxvqjrtuyrbos.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pdHBwanNzeHZxanJ0dXlyYm9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyNzQyNjgsImV4cCI6MjA4NTg1MDI2OH0.O-2UWsBZrw8tyTCXhCcDNAhgY5Ro9_kZRlQoOSUGU3o';

        // Check Session on Load
        if (localStorage.getItem('everdistro_user')) {
            window.location.href = 'dashboard.html';
        }

        function togglePassword() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const isPass = passInput.type === 'password';
            passInput.type = isPass ? 'text' : 'password';
            icon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
            lucide.createIcons();
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const loginText = document.getElementById('loginText');
            const loader = document.getElementById('loginLoader');
            const btn = document.getElementById('submitBtn');
            
            // UI State: Loading
            loginText.classList.add('hidden');
            loader.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            btn.disabled = true;
            
            try {
                // 1. Auth Call
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error_description || 'Check your email and password');

                // 2. Fetch Profile Call
                const profileResponse = await fetch(`${SUPABASE_URL}/rest/v1/profiles?select=*&id=eq.${data.user.id}`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}` // Using Key as bearer for public access or use data.access_token if RLS is enabled
                    }
                });
                
                let profile = null;
                if (profileResponse.ok) {
                    const profiles = await profileResponse.json();
                    profile = profiles[0];
                }
                
                // 3. Store Session
                localStorage.setItem('everdistro_user', JSON.stringify({
                    id: data.user.id,
                    email: data.user.email,
                    full_name: profile?.full_name || data.user.email.split('@')[0],
                    company_name: profile?.company_name || 'Artist',
                    avatar_url: profile?.avatar_url
                }));
                
                localStorage.setItem('everdistro_access_token', data.access_token);
                localStorage.setItem('everdistro_refresh_token', data.refresh_token);
                
                // Success - Redirect
                window.location.href = 'dashboard.html';

            } catch (err) {
                // UI State: Error
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                loginText.classList.remove('hidden');
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
